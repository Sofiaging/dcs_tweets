[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twitter-charge-now-pipeline"
version = "0.1.0"
description = "Replayable extraction and loading pipeline for #ChargeNow tweets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.34,<2",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "psycopg[binary]>=3.1,<4",
  "python-dotenv>=1.0,<2",
  "tenacity>=8.2,<10",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<6",
  "ruff>=0.5,<1",
]

[project.scripts]
twitter-pipeline = "twitter_app.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["twitter_app*"]

[tool.setuptools.package-data]
twitter_app = ["schema.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
